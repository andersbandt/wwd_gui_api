[THEME]
# Available themes: darcula.json (dark), light.json (light blue)
theme_file = darcula.json

[PATHS]
# Base directory for all data output
data_dir = data

[AUTOCONNECT]
# 2=DMM
# 4=USB
# 5=PS
# 6=FG
# 7=ATE
# 10=OSC
tab_1 = NO
tab_2 = NO
tab_3 = NO
tab_4 = YES
tab_5 = NO
tab_6 = NO
tab_7 = NO
tab_8 = NO
tab_9 = NO
tab_10 = NO


[VISA]
# PyVISA backend selection.
# Leave blank to use the NI-VISA default (requires NI-VISA installed).
# Set to @py to use pyvisa-py (pure Python, no NI-VISA required).
backend = @py

[DMM]
# Default measurement rate on connection: slow, medium, fast
rate = slow

[USB]
# Baud rate for USB serial communication
baud_rate = 115200

[LOGGER]
# Filename prefix for recordings
prefix = AREC

[PS]
# Whether to force both PS outputs off immediately after connecting.
# Set to NO to leave the supply's output state untouched on connect — useful
# when reconnecting to an already-powered target you don't want to interrupt.
output_off_on_connect = YES

[SHUTDOWN]
# Whether to open (turn off) all USB relay channels on application exit
# Set to NO to leave relay state unchanged on close
relay_open_on_exit = YES

[Target]
power_type = 2
ps_channel = 1
debug_config = 1
vdds = 3.3
usb_relay = 0
# Delay in seconds before powering back up after a toggle cycle
toggle_power_delay = 6

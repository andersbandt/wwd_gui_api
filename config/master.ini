[THEME]
# Available themes: darcula.json (dark), light.json (light blue)
theme_file = darcula.json

[PATHS]
# Base directory for all data output
data_dir = data

[AUTOCONNECT]
# 2=DMM
# 5=PS
# 6=FG
# 7=ATE
# 10=OSC
tab_1 = NO
tab_2 = YES
tab_3 = NO
tab_4 = NO
tab_5 = YES
tab_6 = NO
tab_7 = NO
tab_8 = NO
tab_9 = NO
tab_10 = YES


[DMM]
# Default sample speed on connection: slow, medium, fast
sample_speed = medium

[USB]
# Baud rate for USB serial communication
baud_rate = 9600

[LOGGER]
# Filename prefix for recordings
prefix = AREC

[Target]
power_type = 2
ps_channel = 1
debug_config = 1
vdds = 3.3
usb_relay = 0
# Delay in seconds before powering back up after a toggle cycle
toggle_power_delay = 6